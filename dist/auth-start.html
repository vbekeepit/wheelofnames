<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Signing in…</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #060f0a; color: #4de8a0; text-align: center; padding: 3rem 1rem; margin: 0; }
    #error { color: #ff6b6b; display: none; font-size: 0.85rem; margin-top: 1rem; word-break: break-all; }
  </style>
</head>
<body>
  <p id="status">Signing in to Microsoft 365…</p>
  <p id="error"></p>
  <script>
    function showError(msg) {
      document.getElementById('status').textContent = 'Sign-in failed';
      var el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function generatePKCE() {
      const verifier = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32))))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
      const challenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
      return { verifier, challenge };
    }

    (async function () {
      try {
        const params = new URLSearchParams(window.location.search);
        const tenantId = params.get('tenantId') || 'common';
        sessionStorage.setItem('spin-wheel:tenantId', tenantId);

        const { verifier, challenge } = await generatePKCE();
        sessionStorage.setItem('spin-wheel:pkce-verifier', verifier);

        const authUrl = new URL('https://login.microsoftonline.com/' + tenantId + '/oauth2/v2.0/authorize');
        authUrl.searchParams.set('client_id', '1729cc2c-d54b-4615-8e4d-8a3460fb3f00');
        authUrl.searchParams.set('response_type', 'code');
        authUrl.searchParams.set('redirect_uri', 'https://vbekeepit.github.io/wheelofnames/auth-end.html');
        authUrl.searchParams.set('scope', 'Chat.ReadBasic Presence.Read.All offline_access');
        authUrl.searchParams.set('code_challenge', challenge);
        authUrl.searchParams.set('code_challenge_method', 'S256');
        authUrl.searchParams.set('response_mode', 'query');

        window.location.href = authUrl.toString();
      } catch (e) {
        showError(e.message || String(e));
      }
    })();
  </script>
</body>
</html>
