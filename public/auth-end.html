<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Completing sign-in…</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #060f0a; color: #4de8a0; text-align: center; padding: 3rem 1rem; margin: 0; }
  </style>
</head>
<body>
  <p>Completing sign-in…</p>
  <script
    src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"
    onerror="document.body.innerHTML='<p style=color:#ff6b6b>MSAL CDN failed to load</p>'">
  </script>
  <script src="https://unpkg.com/@microsoft/teams-js@2.31.0/dist/MicrosoftTeams.min.js"></script>
  <script>
    (async function () {
      var tenantId = sessionStorage.getItem('spin-wheel:tenantId') || 'common';

      try {
        var msalInstance = new msal.PublicClientApplication({
          auth: {
            clientId: 'f4ff3b9d-5b8f-4ea2-859b-4c3ea3e07da4',
            authority: 'https://login.microsoftonline.com/' + tenantId,
            redirectUri: 'https://vbekeepit.github.io/wheelofnames/auth-end.html',
            navigateToLoginRequestUrl: false,
          },
          cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false },
        });

        var response = await msalInstance.handleRedirectPromise();

        await microsoftTeams.app.initialize();

        if (response && response.accessToken) {
          microsoftTeams.authentication.notifySuccess(JSON.stringify({
            accessToken: response.accessToken,
            expiresAt: response.expiresOn ? response.expiresOn.getTime() : Date.now() + 3600000,
          }));
        } else {
          microsoftTeams.authentication.notifyFailure('No access token received');
        }
      } catch (err) {
        try {
          await microsoftTeams.app.initialize();
          microsoftTeams.authentication.notifyFailure(err.message || 'Authentication failed');
        } catch (e) {
          console.error('Failed to notify Teams:', e);
        }
      }
    })();
  </script>
</body>
</html>
